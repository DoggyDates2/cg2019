        // Overlays a single red diagonal line on top of a marker's icon HTML.
        // Used when the row's "Grooming" column says "TOMORROW".
        function applyStrikeThrough(icon, strikeThrough) {
            if (!strikeThrough || !icon || !icon.options || !icon.options.html) return;
            
            const sz = (icon.options.iconSize && icon.options.iconSize[0]) ? icon.options.iconSize[0] : 16;
            const inset = sz * 0.2; // keep the line inside the marker bounds

            icon.options.html =
                `<div style="position:relative;width:${sz}px;height:${sz}px;">` +
                    icon.options.html +
                    `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" ` +
                        `style="position:absolute;top:0;left:0;pointer-events:none;">` +
                        `<line x1="${inset}" y1="${sz - inset}" x2="${sz - inset}" y2="${inset}" ` +
                            `stroke="#ff0000" stroke-width="1.5" stroke-linecap="round"/>` +
                    `</svg>` +
                `</div>`;
        }

        // ==================== MAP INITIALIZATION ====================
        function initMap() {
            try {
                console.log('Initializing map...');
                
                if (typeof L === 'undefined') {
                    throw new Error('Leaflet library not loaded');
                }
                
                state.map = L.map('map', {
                    center: [CONFIG.DEFAULT_LAT, CONFIG.DEFAULT_LNG],
                    zoom: CONFIG.DEFAULT_ZOOM,
                    preferCanvas: true,
                    zoomControl: true,
                    attributionControl: true
                });
                
                // Basemap: CARTO Positron (free key, 5M tiles/mo) or Stadia's
                // Stamen Toner Lite (paid). Either way OSM is the keyless fallback.
                const tileKey = (CONFIG.TILE_API_KEY || '').trim();
                const provider = tileKey ? CONFIG.TILE_PROVIDER : 'osm';

                let tileUrl, tileAttribution, tileMaxZoom;
                if (provider === 'carto') {
                    // Positron raster lives under /rastertiles/ and is served from
                    // the a-d subdomains; the shorter path silently 404s.
                    tileUrl = `https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=${tileKey}`;
                    tileAttribution = '&copy; OpenStreetMap contributors &copy; CARTO';
                    tileMaxZoom = 20;
                } else if (provider === 'stadia') {
                    tileUrl = `https://tiles.stadiamaps.com/tiles/stamen_toner_lite/{z}/{x}/{y}{r}.png?api_key=${tileKey}`;
                    tileAttribution = '&copy; Stadia Maps &copy; Stamen Design &copy; OpenStreetMap contributors';
                    tileMaxZoom = 20;
                } else {
                    tileUrl = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
                    tileAttribution = '&copy; OpenStreetMap contributors';
                    tileMaxZoom = 19;
                }
                
                console.log(`Loading map tiles: ${provider}`);
                
                const tileLayer = L.tileLayer(tileUrl, {
                    attribution: tileAttribution,
                    subdomains: provider === 'carto' ? 'abcd' : 'abc',
                    maxZoom: tileMaxZoom,
                    minZoom: 2,
                    errorTileUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
                });
                
                let fallbackLayer = null;
                let tileLoadTimeout = null;
                
                tileLoadTimeout = setTimeout(() => {
                    const tiles = document.querySelectorAll('.leaflet-tile');
                    if (tiles.length === 0 && !fallbackLayer) {
                        console.warn('No tiles loaded - switching to fallback');
                        showNotification('Stamen server not responding, trying fallback...', 'info');
                        
                        fallbackLayer = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
                            attribution: '&copy; OpenStreetMap contributors',
                            maxZoom: 18
                        });
                        state.map.removeLayer(tileLayer);
                        fallbackLayer.addTo(state.map);
                    }
                }, 5000);
                
                tileLayer.on('tileerror', function(error) {
                    console.error('Tile load error:', error);
                    if (tileLoadTimeout) {
                        clearTimeout(tileLoadTimeout);
                        tileLoadTimeout = null;
                    }
                    
                    if (!fallbackLayer) {
                        console.log('Switching to fallback map provider (CartoDB Positron)...');
                        fallbackLayer = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
                            attribution: '&copy; OpenStreetMap contributors',
                            maxZoom: 18
                        });
                        state.map.removeLayer(tileLayer);
                        fallbackLayer.addTo(state.map);
                        showNotification('Using fallback map tiles', 'info');
                    }
                });
                
                tileLayer.on('tileload', function() {
                    if (tileLoadTimeout) {
                        clearTimeout(tileLoadTimeout);
                        tileLoadTimeout = null;
                    }
                });
                
                tileLayer.addTo(state.map);
                state.map.on('zoomend', applyFieldArrows);
                // Layout is pan-invariant, so this only needs redoing on zoom.
                state.map.on('zoomend', applyDriverLabels);

                
                setTimeout(() => {
                    const tiles = document.querySelectorAll('.leaflet-tile');
                    const loadedTiles = document.querySelectorAll('.leaflet-tile-loaded');
                    if (tiles.length === 0) {
                        console.warn('No tiles found - map provider may be down');
                        console.warn('Current tile URL pattern:', tileUrl);
                        showNotification('Map tiles not loading - check console for details', 'error');
                    } else {
                        console.log(`Map tiles status: ${tiles.length} total, ${loadedTiles.length} loaded`);
                        if (loadedTiles.length === 0) {
                            console.warn('Tiles found but none loaded - possible network issue');
                        }
                    }
                }, 3000);
                
                state.map.on('error', function(e) {
                    console.error('Map error:', e);
                });

                console.log('Map initialized successfully');
                
            } catch (error) {
                console.error('Error initializing map:', error);
                showNotification('Failed to initialize map. Please refresh the page.', 'error', 0);
            }
        }

        // ==================== LOAD FIELDS DATA ====================
        async function loadFieldsData() {
            try {
                if (!CONFIG.SHEET_ID || !CONFIG.API_KEY) {
                    console.log('No fields data - Sheet ID or API key not configured');
                    return;
                }
                
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${CONFIG.FIELDS_WORKSHEET_NAME}?key=${CONFIG.API_KEY}`;
                
                console.log(`Loading fields data from tab: "${CONFIG.FIELDS_WORKSHEET_NAME}"`);
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        console.log('Fields tab not found - this is optional');
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (!data || !data.values || data.values.length < 2) {
                    console.log('No data in Fields tab');
                    return;
                }
                
                const headers = data.values[0];
                const rows = data.values.slice(1);
                
                console.log('Fields tab headers:', headers);
                
                // Validate required columns
                const requiredColumns = ['Field Name', 'Latitude', 'Longitude'];
                const missingColumns = requiredColumns.filter(col => !headers.includes(col));
                
                if (missingColumns.length > 0) {
                    console.warn(`Fields tab missing columns: ${missingColumns.join(', ')}`);
                    return;
                }
                
                // Process fields data
                const processedFields = [];
                let validFields = 0;
                
                rows.forEach((row, index) => {
                    try {
                        const obj = {};
                        headers.forEach((header, headerIndex) => {
                            obj[header] = row[headerIndex] || '';
                        });
                        
                        if (!obj['Field Name'] || obj['Field Name'].trim() === '') {
                            return;
                        }
                        
                        const lat = parseFloat(obj['Latitude']);
                        const lng = parseFloat(obj['Longitude']);
                        
                        if (!validateCoordinates(lat, lng)) {
                            return;
                        }
                        
                        obj['_lat'] = lat;
                        obj['_lng'] = lng;
                        
                        processedFields.push(obj);
                        validFields++;
                        
                    } catch (rowError) {
                        console.warn(`Error processing field row ${index + 2}:`, rowError);
                    }
                });
                
                state.fieldsData = processedFields;
                
                if (validFields > 0) {
                    console.log(`Loaded ${validFields} field locations`);
                    updateFieldsDisplay();
                    addFieldMarkers();
                }
                
            } catch (error) {
                console.error('Error loading fields data:', error);
                // This is optional data, so don't show error to user
            }
        }

        // ==================== ADD FIELD MARKERS ====================
        function addFieldMarkers() {
            // The per-driver F pins built from the Staff tab replace these, and the
            // two sources' coordinates differ slightly, so drawing both puts two
            // markers ~100m apart for the same field.
            if (!CONFIG.SHOW_FIELDS_TAB_DIAMONDS && !state.useLegacyFields) {
                state.fieldMarkers.forEach(marker => {
                    if (marker && state.map && state.map.hasLayer(marker)) {
                        state.map.removeLayer(marker);
                    }
                });
                state.fieldMarkers = [];
                return;
            }

            // Clear existing field markers
            state.fieldMarkers.forEach(marker => {
                if (marker && state.map.hasLayer(marker)) {
                    state.map.removeLayer(marker);
                }
            });
            state.fieldMarkers = [];
            
            if (!state.fieldsData || state.fieldsData.length === 0) {
                return;
            }
            
            state.fieldsData.forEach(field => {
                try {
                    const lat = field['_lat'] ?? parseFloat(field['Latitude']);
                    const lng = field['_lng'] ?? parseFloat(field['Longitude']);
                    
                    if (!validateCoordinates(lat, lng)) return;
                    
                    const marker = L.marker([lat, lng], {
                        icon: createFieldDiamondIcon(),
                        riseOnHover: true
                    });
                    
                    // Create tooltip for field
                    const fieldName = field['Field Name'] || 'Unknown Field';
                    const notes = field['Notes'] || '';
                    
                    let tooltipHtml = `<div style="text-align: center;"><strong>${escapeHtml(fieldName)}</strong>`;
                    if (notes) {
                        tooltipHtml += `<br/><span style="font-style: italic;">${escapeHtml(notes)}</span>`;
                    }
                    tooltipHtml += `</div>`;
                    
                    marker.bindTooltip(tooltipHtml, {
                        permanent: false,
                        direction: 'top',
                        offset: [0, -12],
                        className: 'field-marker-tooltip',
                        opacity: 0.95
                    });
                    
                    // Add marker to map
                    marker.addTo(state.map);
                    
                    // Field markers are not editable, so no click handler for editing
                    
                    state.fieldMarkers.push(marker);
                    
                } catch (error) {
                    console.warn('Error creating field marker:', error);
                }
            });
        }

        // ==================== UPDATE FIELDS DISPLAY ====================
        function updateFieldsDisplay() {
            const fieldsSection = document.getElementById('fieldsSection');
            const fieldsContent = document.getElementById('fieldsContent');
            
            if (!fieldsSection || !fieldsContent) return;
            
            if (state.fieldsData && state.fieldsData.length > 0) {
                fieldsSection.style.display = 'block';
                
                const fieldsHtml = state.fieldsData.map(field => {
                    const fieldName = escapeHtml(field['Field Name'] || 'Unknown');
                    return `<div class="field-item">
                        <div class="field-diamond"></div>
                        <span>${fieldName}</span>
                    </div>`;
                }).join('');
                
                fieldsContent.innerHTML = fieldsHtml || '<div class="no-selection">No fields found</div>';
            } else {
                fieldsSection.style.display = 'none';
            }
        }

        // ==================== STAFF: PARKING + FIELD LOCATIONS ====================
        // Reads the "Staff" tab once. Columns A:H are the driver assignments
        // (driver -> Field ID / Parking ID for today). A second, unrelated block
        // starting around column J holds the ID -> lat/lng/address lookup. The two
        // blocks are independent, so each is located by its own header row.

        // Finds the header row for the location lookup by hunting for a row that
        // has both "ID" and "Latitude" at or past column J (index 9). Falling back
        // to a scan means the block can be moved without touching this code.
        // Normalizes an address so small differences ("Ma" vs "MA", double spaces,
        // a trailing period) don't stop a nickname from matching.
        function normalizeAddress(text) {
            return String(text || '')
                .toLowerCase()
                .replace(/[.,#]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Second, optional lookup living further right on the Staff tab: an address
        // in one column and the short name we want to display in another. Keyed by
        // address rather than row position, so it can't drift out of alignment.
        function parseAliasBlock(values) {
            const MIN_COL = 13; // column N, so anything from N over is safe
            const NAME_HEADERS = ['name', 'short name', 'nickname', 'label', 'short'];

            state.addressAliases.clear();

            let addrCol = -1;
            let nameCol = -1;
            let headerRow = -1;

            // Prefer explicit headers if they're there.
            for (let r = 0; r < values.length && headerRow === -1; r++) {
                const row = values[r] || [];
                let a = -1, n = -1;
                for (let c = MIN_COL; c < row.length; c++) {
                    const cell = String(row[c] || '').trim().toLowerCase();
                    if (cell === 'address' && a === -1) a = c;
                    else if (NAME_HEADERS.indexOf(cell) !== -1 && n === -1) n = c;
                }
                if (a !== -1 && n !== -1) {
                    addrCol = a;
                    nameCol = n;
                    headerRow = r;
                }
            }

            // Otherwise work it out from the content: the address column is the one
            // whose values actually match known location addresses, and the name is
            // the nearest non-empty column to its right. That way the block can sit
            // at N, O, or anywhere further over without a code change.
            if (headerRow === -1) {
                const known = new Set();
                state.locationsMap.forEach(loc => known.add(normalizeAddress(loc.address)));

                let bestCol = -1;
                let bestHits = 0;
                const width = values.reduce((max, row) => Math.max(max, (row || []).length), 0);

                for (let c = MIN_COL; c < width; c++) {
                    let hits = 0;
                    for (let r = 0; r < values.length; r++) {
                        const cell = normalizeAddress((values[r] || [])[c]);
                        if (cell && known.has(cell)) hits++;
                    }
                    if (hits > bestHits) {
                        bestHits = hits;
                        bestCol = c;
                    }
                }

                if (bestCol === -1) {
                    console.log('No short-name block found from column N over');
                    return;
                }

                addrCol = bestCol;
                nameCol = -1;
                for (let c = bestCol + 1; c < width && nameCol === -1; c++) {
                    for (let r = 0; r < values.length; r++) {
                        if (String((values[r] || [])[c] || '').trim()) { nameCol = c; break; }
                    }
                }

                if (nameCol === -1) {
                    console.log('Found addresses but no short-name column to their right');
                    return;
                }
            }

            for (let i = headerRow + 1; i < values.length; i++) {
                const row = values[i] || [];
                const address = String(row[addrCol] || '').trim();
                const name = String(row[nameCol] || '').trim();
                if (!address || !name) continue;
                if (address.toLowerCase() === 'address') continue; // stray header
                state.addressAliases.set(normalizeAddress(address), name);
            }

            if (state.addressAliases.size > 0) {
                console.log(`Loaded ${state.addressAliases.size} short names (address col ${addrCol + 1}, name col ${nameCol + 1})`);

                // Flag any nickname that doesn't match a real location, since a typo
                // here fails silently and just shows the long address instead.
                const known = new Set();
                state.locationsMap.forEach(loc => known.add(normalizeAddress(loc.address)));
                const orphans = [];
                state.addressAliases.forEach((name, key) => {
                    if (!known.has(key)) orphans.push(name);
                });
                if (orphans.length > 0) {
                    console.warn(`Short names with no matching location address: ${orphans.join(', ')}`);
                }
            } else {
                console.log('No short-name block found from column N over');
            }
        }

        function parseLocationBlock(values) {
            const MIN_COL = 8; // column I, so anything from J over is safe
            const NAME_HEADERS = ['name', 'short name', 'nickname', 'label', 'short'];

            for (let r = 0; r < values.length; r++) {
                const row = values[r] || [];
                let idCol = -1, latCol = -1, lngCol = -1, addrCol = -1, nameCol = -1;

                for (let c = MIN_COL; c < row.length; c++) {
                    const cell = String(row[c] || '').trim().toLowerCase();
                    if (cell === 'id' && idCol === -1) idCol = c;
                    else if (cell === 'latitude' && latCol === -1) latCol = c;
                    else if (cell === 'longitude' && lngCol === -1) lngCol = c;
                    else if (cell === 'address' && addrCol === -1) addrCol = c;
                    else if (NAME_HEADERS.indexOf(cell) !== -1 && nameCol === -1) nameCol = c;
                }

                if (idCol === -1 || latCol === -1 || lngCol === -1) continue;

                state.locationsMap.clear();
                for (let i = r + 1; i < values.length; i++) {
                    const dataRow = values[i] || [];
                    const id = String(dataRow[idCol] || '').trim();
                    if (!id) continue;
                    const lat = parseFloat(dataRow[latCol]);
                    const lng = parseFloat(dataRow[lngCol]);
                    if (!validateCoordinates(lat, lng)) continue;
                    state.locationsMap.set(id, {
                        lat: lat,
                        lng: lng,
                        address: addrCol >= 0 ? String(dataRow[addrCol] || '').trim() : '',
                        name: nameCol >= 0 ? String(dataRow[nameCol] || '').trim() : ''
                    });
                }

                console.log(`Loaded ${state.locationsMap.size} location coordinates (row ${r + 1}, col ${idCol + 1})`
                    + (nameCol >= 0 ? `, short names from col ${nameCol + 1}` : ', no short-name column found'));
                return true;
            }

            console.warn('No ID/Latitude/Longitude block found at or past column J on the Staff tab');
            return false;
        }

        async function loadStaffData() {
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${CONFIG.STAFF_WORKSHEET_NAME}?key=${CONFIG.API_KEY}`;
                const response = await fetch(url);
                if (!response.ok) {
                    if (response.status === 400 || response.status === 404) {
                        console.log('Staff tab not found - falling back to plain field markers');
                        addStaffMarkers(true);
                        return;
                    }
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                const values = (data && data.values) || [];
                if (values.length < 2) { addStaffMarkers(true); return; }

                // Location lookup lives on this same tab, off to the right.
                parseLocationBlock(values);

                // Each staff block is 8 columns wide and always in the same order:
                //   date | START TIME | FIELD | CAR | CAR ADDRESS | NOTES | Field ID | Parking ID
                // Blocks are located by their "START TIME" header, then read
                // positionally -- the second block's "Field ID"/"Parking ID" header
                // cells are blank, so looking those up by name finds nothing.
                const headers = (values[0] || []).map(h => String(h || '').trim());
                const starts = [];
                headers.forEach((h, i) => { if (h.toUpperCase() === 'START TIME') starts.push(i); });

                const wanted = CONFIG.STAFF_BLOCK || 0;
                if (starts.length <= wanted) {
                    console.warn(`Staff block ${wanted} not found (${starts.length} present)`);
                    return;
                }

                const base = starts[wanted] - 1; // driver-name column
                const startCol     = base + 1;
                const fieldAddrCol = base + 2;
                const carCol       = base + 3;
                const parkAddrCol  = base + 4;
                const notesCol     = base + 5;
                const fieldIdCol   = base + 6;
                const parkIdCol    = base + 7;

                console.log(`Reading staff block ${wanted} at column ${base + 1} (${headers[base] || 'unlabelled'})`);

                const staff = [];
                for (let i = 1; i < values.length; i++) {
                    const row = values[i] || [];
                    const driver = String(row[base] || '').trim();
                    if (!driver) continue;

                    const startTime = String(row[startCol] || '').trim();
                    if (startTime.toUpperCase() === 'OFF') continue; // not working today

                    const fieldId = String(row[fieldIdCol] || '').trim();
                    const parkingId = String(row[parkIdCol] || '').trim();
                    if (!fieldId && !parkingId) continue;

                    staff.push({
                        driver: driver,
                        startTime: startTime,
                        fieldId: fieldId,
                        parkingId: parkingId,
                        fieldAddress: String(row[fieldAddrCol] || '').trim(),
                        parkingAddress: String(row[parkAddrCol] || '').trim(),
                        car: String(row[carCol] || '').trim(),
                        notes: String(row[notesCol] || '').trim()
                    });
                }

                state.staffData = staff;
                state.staffByDriver.clear();
                staff.forEach(entry => state.staffByDriver.set(entry.driver, entry));

                console.log(`Loaded ${staff.length} working drivers from Staff tab`);
                updateStaffLegend();

                // Staff data arrives after the dog markers are already drawn.
                // Patch the tooltips in place rather than calling updateMap(), which
                // would rebuild every dog marker and drop any active selection.
                refreshDogTooltipsWithStaff();
                applyFieldArrows();
                addStaffMarkers(true);
            } catch (error) {
                console.error('Error loading Staff tab:', error);
                try { addStaffMarkers(true); } catch (e) { /* fallback is best-effort */ }
            }
        }

        // Deliberately muted: fields are the same black diamonds as before, and
        // parking is a matching dark square. One marker per location, not per
        // driver -- the per-driver detail lives in the tooltip instead.
        let staffIconSeq = 0; // unique clipPath ids so the wedges don't bleed between icons

        // Both shapes are split into one colour band per driver, clipped to the
        // silhouette. A dog marker is always a single colour, so a multi-band square
        // can only be parking and needs no label. A one-driver parking square is the
        // ambiguous case -- it could be a Group 3 dog -- so that one keeps its "P".
        function createStaffIcon(kind, colors) {
            const list = (colors && colors.length) ? colors : ['#000000'];
            const isParking = kind === 'parking';

            // A diamond only reaches full width at its midpoint, so it needs more
            // room per band than a square does.
            const perBand = isParking ? 5 : 7;
            const spanCount = isParking
                ? Math.ceil(list.length / (list.length <= 4 ? 1 : (list.length <= 8 ? 2 : 3)))
                : list.length;
            const size = Math.min(44, Math.max(24, 10 + spanCount * perBand));

            const shape = isParking
                ? `M4 ${size - 4} L4 4 L${size - 4} 4 L${size - 4} ${size - 4} Z`
                : `M${size / 2} 3 L${size - 3} ${size / 2} L${size / 2} ${size - 3} L3 ${size / 2} Z`;

            const clipId = `staffclip${++staffIconSeq}`;

            // Past 4 drivers a square stacks its colours into rows instead of
            // getting wider, so a busy lot stays compact. Diamonds keep single
            // columns -- a grid would clip badly against the tapering sides.
            const rows = (!isParking || list.length <= 4) ? 1 : (list.length <= 8 ? 2 : 3);
            const cols = Math.ceil(list.length / rows);

            const cells = [];
            const cellH = size / rows;
            for (let r = 0; r < rows; r++) {
                const inRow = list.slice(r * cols, (r + 1) * cols);
                // A short final row stretches to fill, so there's never a blank gap.
                const cellW = size / inRow.length;
                inRow.forEach((c, i) => {
                    cells.push(`<rect x="${(i * cellW).toFixed(2)}" y="${(r * cellH).toFixed(2)}" ` +
                               `width="${cellW.toFixed(2)}" height="${cellH.toFixed(2)}" fill="${c}"/>`);
                });
            }
            const bands = cells.join('');


            const letter = (isParking && list.length === 1)
                ? `<text x="${size / 2}" y="${size / 2 + 4}" text-anchor="middle" font-size="12"
                         font-family="sans-serif" font-weight="700" fill="#ffffff"
                         stroke="#000000" stroke-width="2.5" paint-order="stroke">P</text>`
                : '';

            return L.divIcon({
                html: `<div style="position:relative; width:${size}px; height:${size}px;">
                    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
                            style="filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.35));">
                        <defs><clipPath id="${clipId}"><path d="${shape}"/></clipPath></defs>
                        <g clip-path="url(#${clipId})">${bands}</g>
                        <path d="${shape}" fill="none" stroke="#000000"
                              stroke-width="${size <= 26 ? 4 : 3}" stroke-linejoin="round"/>
                        ${letter}
                    </svg></div>`,
                className: `custom-staff-marker staff-${kind}`,
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        function clearStaffMarkers() {
            state.staffMarkers.forEach(marker => {
                if (marker && state.map && state.map.hasLayer(marker)) {
                    state.map.removeLayer(marker);
                }
            });
            state.staffMarkers = [];
        }

        // Short name for a location ID, falling back to its address then the ID.
        function locationLabel(id, fallbackAddress) {
            const loc = state.locationsMap.get(id);
            const address = (loc && loc.address) || fallbackAddress || '';
            const name = (loc && loc.name) || state.addressAliases.get(normalizeAddress(address)) || '';
            return name || address || id || '';
        }

        // "VAN" or "RAV" from the Staff tab's CAR column (column D). Substring
        // match, case-insensitive, so entries like "\\#VAN CAM^GoldSiennaW75165"
        // and "RedRav5KCC23" both hit. Anything else returns nothing at all.
        function buildVehicleTag(driverName, inline) {
            try {
                if (!driverName) return '';
                const entry = state.staffByDriver.get(driverName.trim());
                if (!entry || !entry.car) return '';

                const car = entry.car.toLowerCase();
                let tag = '';
                if (car.includes('van')) tag = 'VAN';
                else if (car.includes('rav')) tag = 'RAV';
                if (!tag) return '';

                return inline
                    ? `<span style="font-size:12px;color:#ffffff;font-weight:600;letter-spacing:.5px;">&nbsp;&nbsp;${tag}</span>`
                    : `<br/><span style="font-size:12px;color:#ffffff;font-weight:600;letter-spacing:.5px;">${tag}</span>`;
            } catch (error) {
                console.warn('Vehicle tag skipped:', error);
                return '';
            }
        }

        // Small "F: Sherborn  P: Elbery" line appended to each dog's tooltip.
        function buildStaffSuffix(driverName) {
            try {
                if (!driverName) return '';
                const entry = state.staffByDriver.get(driverName.trim());
                if (!entry) return '';

                const field = locationLabel(entry.fieldId, entry.fieldAddress);
                const parking = locationLabel(entry.parkingId, entry.parkingAddress);
                if (!field && !parking) return '';

                // Field first, parking second, on a single nowrap line. Names are
                // short enough that the worst case still fits.
                const line = [field, parking].filter(Boolean).map(escapeHtml).join(' &middot; ');

                return `<div style="margin-top:5px;font-size:12px;color:#ffffff;font-weight:400;`
                     + `line-height:1.35;white-space:nowrap;">${line}</div>`;
            } catch (error) {
                console.warn('Staff suffix skipped:', error);
                return '';
            }
        }

        // Patches the F:/P: line into tooltips of markers already on the map,
        // without recreating them, so selection and edit state survive.
        // Small triangle on the edge of each dog marker pointing toward that
        // driver's field. Appended to the marker's rendered element rather than
        // baked into createMarkerIcon(), so the dog icon code is never touched --
        // if any of this fails the dog is exactly as it was.
        function applyFieldArrows() {
            if (!state.map) return;

            state.markers.forEach(m => {
                try {
                    const marker = m && m.marker;
                    if (!marker || typeof marker.getElement !== 'function') return;
                    const el = marker.getElement();
                    if (!el) return;

                    const existing = el.querySelector('.field-arrow');
                    if (existing) existing.remove();
                    if (!state.showDriverInfo) return;

                    const entry = state.staffByDriver.get(String(marker._tooltipDriver || '').trim());
                    if (!entry) return;
                    const field = state.locationsMap.get(entry.fieldId);
                    if (!field) return;

                    // Bearing in screen space, so it matches what the eye sees.
                    const here = state.map.latLngToLayerPoint(marker.getLatLng());
                    const there = state.map.latLngToLayerPoint(L.latLng(field.lat, field.lng));
                    const dx = there.x - here.x;
                    const dy = there.y - here.y;
                    if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return; // sitting on it

                    const deg = Math.atan2(dx, -dy) * 180 / Math.PI;

                    el.style.overflow = 'visible';
                    const arrow = document.createElement('div');
                    arrow.className = 'field-arrow';
                    arrow.style.cssText =
                        'position:absolute; left:50%; top:50%; width:0; height:0;'
                        + 'pointer-events:none; z-index:400;'
                        + `transform:translate(-50%,-50%) rotate(${deg.toFixed(1)}deg);`;
                    // A real arrow -- shaft plus head -- rather than a lone triangle,
                    // which was unreadable at 5px against the basemap.
                    arrow.innerHTML =
                        '<svg width="8" height="10" viewBox="0 0 16 20"'
                        + ' style="position:absolute; left:-4px; top:-15px; overflow:visible;">'
                        + '<g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"'
                        + ' stroke-linejoin="round">'
                        + '<path d="M8 19 L8 5"/><path d="M2.5 10 L8 4 L13.5 10"/></g>'
                        + '<g stroke="#111111" stroke-width="2.5" fill="none" stroke-linecap="round"'
                        + ' stroke-linejoin="round">'
                        + '<path d="M8 19 L8 5"/><path d="M2.5 10 L8 4 L13.5 10"/></g>'
                        + '</svg>';
                    el.appendChild(arrow);
                } catch (error) {
                    /* an arrow is decoration; never let it bubble */
                }
            });
        }

        function clearDriverLabels() {
            state.driverLabels.forEach(m => {
                if (m && state.map && state.map.hasLayer(m)) state.map.removeLayer(m);
            });
            state.driverLabels = [];
        }

        // Dogs per group for one driver, counted exactly as the legend does so the
        // cluster label and the legend can never disagree.
        function computeDriverGroupCounts(driver) {
            const counts = { 1: 0, 2: 0, 3: 0 };
            if (!state.allData || !state.activeColumn) return counts;

            state.allData.forEach(row => {
                if (!row || !row[state.activeColumn]) return;
                const columnValue = row[state.activeColumn].trim();
                if (!columnValue || isTrulyCancelled(columnValue)) return;

                const parsed = parseCombined(columnValue);
                if (parsed.driver !== driver) return;

                const dogCount = parseInt(row['Number of Dogs'] || '1') || 1;
                groupDigitsForCount(columnValue).forEach(n => { counts[n] += dogCount; });
            });
            return counts;
        }

        // "Chi.VAN.8,9,7" -- driver, vehicle if they have one, then group counts.
        function driverLabelText(driver) {
            const parts = [driver];

            const entry = state.staffByDriver.get(driver);
            const car = String((entry && entry.car) || '').toLowerCase();
            if (car.includes('van')) parts.push('VAN');
            else if (car.includes('rav')) parts.push('RAV');

            const c = computeDriverGroupCounts(driver);
            if (c[1] + c[2] + c[3] > 0) parts.push(`${c[1]},${c[2]},${c[3]}`);

            return parts.join('.');
        }

        // Splits one driver's dogs into separate clumps by proximity, so a driver
        // working two towns gets a label on each. A single centroid across both
        // would land in the empty space between them.
        function splitIntoClumps(points, maxGap) {
            const remaining = points.slice();
            const clumps = [];

            while (remaining.length) {
                const clump = [remaining.pop()];
                let grew = true;
                while (grew) {
                    grew = false;
                    for (let i = remaining.length - 1; i >= 0; i--) {
                        const p = remaining[i];
                        const near = clump.some(q =>
                            Math.hypot(p.x - q.x, p.y - q.y) <= maxGap);
                        if (near) {
                            clump.push(p);
                            remaining.splice(i, 1);
                            grew = true;
                        }
                    }
                }
                clumps.push(clump);
            }
            return clumps;
        }

        // Driver name written near that driver's cluster once you're zoomed in far
        // enough to have room. Positions are chosen by trying candidate spots around
        // the cluster centre and keeping whichever overlaps the fewest markers and
        // already-placed labels, so names don't sit on top of pins.
        function applyDriverLabels() {
            try {
                clearDriverLabels();
                if (!state.map) return;
                if (state.map.getZoom() < CONFIG.DRIVER_LABEL_MIN_ZOOM) return;

                const toPoint = ll => state.map.latLngToLayerPoint(ll);

                // Every dog and every field/parking marker, NOT just the visible
                // ones. Layer points are pan-invariant, so using the full set makes
                // the layout depend only on zoom -- filtering by viewport made
                // clumps regroup on every pan and the labels flickered.
                const obstacles = [];
                const clusters = new Map();

                state.markers.forEach(m => {
                    const marker = m && m.marker;
                    if (!marker || typeof marker.getLatLng !== 'function') return;
                    const pt = toPoint(marker.getLatLng());
                    obstacles.push({ x: pt.x - 9, y: pt.y - 9, w: 18, h: 18 });

                    const driver = String(marker._tooltipDriver || '').trim();
                    if (!driver) return;
                    if (!clusters.has(driver)) clusters.set(driver, []);
                    clusters.get(driver).push(pt);
                });

                state.staffMarkers.forEach(marker => {
                    const pt = toPoint(marker.getLatLng());
                    // Sized to the actual marker, not a flat 44px: an oversized box
                    // made every location label collide with its own marker.
                    const half = (marker._locationSize || 28) / 2 + 2;
                    obstacles.push({ x: pt.x - half, y: pt.y - half, w: half * 2, h: half * 2 });
                });

                const hits = (box, list) => list.reduce((n, o) =>
                    n + ((box.x < o.x + o.w && box.x + box.w > o.x &&
                          box.y < o.y + o.h && box.y + box.h > o.y) ? 1 : 0), 0);

                // Biggest clusters get first pick of the clear space.
                const ordered = [...clusters.entries()].sort((a, b) => b[1].length - a[1].length);
                const placed = [];

                // Flatten to one entry per clump, then place biggest-first so the
                // densest groups get the clear space.
                const jobs = [];
                ordered.forEach(([driver, pts]) => {
                    splitIntoClumps(pts, CONFIG.DRIVER_LABEL_SPLIT_PX)
                        .filter(c => c.length >= 2) // a lone dog isn't a cluster
                        .sort((a, b) => b.length - a.length)
                        .slice(0, CONFIG.DRIVER_LABEL_MAX_PER_DRIVER)
                        .forEach(clump => jobs.push({ driver, pts: clump }));
                });
                jobs.sort((a, b) => b.pts.length - a.pts.length);

                // Driver name/count labels are optional (Hide Driver Info); the
                // parking/field name captions below always draw.
                (state.showDriverInfo ? jobs : []).forEach(({ driver, pts }) => {
                    const cx = pts.reduce((s2, p2) => s2 + p2.x, 0) / pts.length;
                    const cy = pts.reduce((s2, p2) => s2 + p2.y, 0) / pts.length;

                    const text = driverLabelText(driver);
                    const w = text.length * 7 + 8;
                    const h = 16;

                    let best = null;
                    for (const radius of [0, 26, 46, 70, 100]) {
                        for (let a = 0; a < 8; a++) {
                            const ang = (a / 8) * Math.PI * 2 - Math.PI / 2;
                            const x = cx + (radius ? Math.cos(ang) * radius : 0) - w / 2;
                            const y = cy + (radius ? Math.sin(ang) * radius : 0) - h / 2;
                            const box = { x, y, w, h };
                            // Labels colliding with each other is worse than a label
                            // brushing a pin, so weight them heavier.
                            const score = hits(box, obstacles) + hits(box, placed) * 4;
                            if (!best || score < best.score) best = { score, box };
                            if (score === 0) break;
                        }
                        if (best && best.score === 0) break;
                    }
                    if (!best) return;

                    placed.push(best.box);

                    const centre = L.point(best.box.x + w / 2, best.box.y + h / 2);
                    const colour = getDriverColor(driver);

                    const label = L.marker(state.map.layerPointToLatLng(centre), {
                        interactive: false,
                        zIndexOffset: 900,
                        icon: L.divIcon({
                            className: 'driver-cluster-label',
                            iconSize: [w, h],
                            iconAnchor: [w / 2, h / 2],
                            html: `<div style="font:700 12px/16px system-ui,sans-serif;
                                        text-align:center; white-space:nowrap; color:${colour};
                                        text-shadow:-2px -2px 0 #fff, 2px -2px 0 #fff,
                                                    -2px 2px 0 #fff, 2px 2px 0 #fff, 0 0 4px #fff;
                                        pointer-events:none;">${escapeHtml(text)}</div>`
                        })
                    });

                    label.addTo(state.map);
                    state.driverLabels.push(label);
                });

                // Field and parking names last, and only where nothing at all is in
                // the way. Driver labels and dogs have already claimed their space,
                // so a location name appears only if it genuinely fits.
                state.staffMarkers.forEach(marker => {
                    const name = marker._locationName;
                    if (!name) return;

                    const pt = toPoint(marker.getLatLng());
                    const w = name.length * 6.5 + 6;
                    const h = 14;
                    // Clear the marker's own obstacle box plus half the label.
                    const gap = (marker._locationSize || 28) / 2 + 2 + h / 2 + 3;

                    // Below first -- it reads as a caption -- then above, then sides.
                    const candidates = [
                        { x: pt.x - w / 2, y: pt.y + gap - h / 2 },
                        { x: pt.x - w / 2, y: pt.y - gap - h / 2 },
                        { x: pt.x + gap + w / 2 - w, y: pt.y - h / 2 },
                        { x: pt.x - gap - w / 2, y: pt.y - h / 2 }
                    ];

                    const spot = candidates.find(c => {
                        const box = { x: c.x, y: c.y, w: w, h: h };
                        return hits(box, obstacles) === 0 && hits(box, placed) === 0;
                    });
                    if (!spot) return; // no room; stay silent rather than overlap

                    placed.push({ x: spot.x, y: spot.y, w: w, h: h });

                    const centre = L.point(spot.x + w / 2, spot.y + h / 2);
                    const tag = L.marker(state.map.layerPointToLatLng(centre), {
                        interactive: false,
                        zIndexOffset: 880,
                        icon: L.divIcon({
                            className: 'location-name-label',
                            iconSize: [w, h],
                            iconAnchor: [w / 2, h / 2],
                            html: `<div style="font:700 11px/14px system-ui,sans-serif;
                                        text-align:center; white-space:nowrap; color:#000;
                                        text-shadow:-2px -2px 0 #fff, 2px -2px 0 #fff,
                                                    -2px 2px 0 #fff, 2px 2px 0 #fff, 0 0 4px #fff;
                                        pointer-events:none;">${escapeHtml(name)}</div>`
                        })

                    tag.addTo(state.map);

        function refreshDogTooltipsWithStaff() {
            state.markers.forEach(m => {
                try {
                    if (!m || !m.marker || !m.marker._baseTooltipHtml) return;
                    m.marker.setTooltipContent(
                        m.marker._baseTooltipHtml
                            .replace('<!--VEHICLE_INLINE-->', buildVehicleTag(m.marker._tooltipDriver, true))
                            .replace('<!--VEHICLE_BLOCK-->', buildVehicleTag(m.marker._tooltipDriver, false))
                        + buildStaffSuffix(m.marker._tooltipDriver) + '</div>'
                    );
                } catch (error) {
                    /* a tooltip is cosmetic; never let it bubble */
                }
            });
        }

        // Tooltip for a location: what it is, then every driver using it today
        // with their colour swatch and start time.
        // Driver colours are picked for white marker fills, and the darkest of them
        // (#2F3542, #1B5E20, ...) disappear against a dark tooltip. Rather than
        // lightening -- which would drift away from the colour on the diamond --
        // keep the true colour and ring dark ones with a white halo.
        function driverTextStyle(hex) {
            const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
            if (!m) return 'color:#ffffff;';

            const r = parseInt(m[1].slice(0, 2), 16);
            const g = parseInt(m[1].slice(2, 4), 16);
            const b = parseInt(m[1].slice(4, 6), 16);
            const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;

            const color = `color:#${m[1]};`;
            if (lum >= 0.45) return color;

            // Four offset copies plus a soft glow: an outline that survives at 12px
            // where a single blurred shadow just muddies the glyph edges.
            return color + 'text-shadow:'
                + '-1px -1px 0 #fff, 1px -1px 0 #fff,'
                + '-1px  1px 0 #fff, 1px  1px 0 #fff,'
                + ' 0 0 3px #fff;';
        }

        // Deliberately minimal: the location name on its own line, then the
        // drivers using it, two per line. Which kind of marker it is and how many
        // drivers there are are both obvious from the shape and the list itself.
        function buildStaffTooltip(spot) {
            const title = locationLabel(spot.id, '') || spot.id;

            // Two names per line, each in that driver's own colour.
            const nameBlock = (drivers) => {
                const names = drivers.map(d => d.driver).sort((a, b) => a.localeCompare(b));
                const lines = [];
                for (let i = 0; i < names.length; i += 2) {
                    const pair = names.slice(i, i + 2);
                    const trailing = (i + 2 < names.length) ? ',' : '';
                    lines.push(pair.map((n, j) =>
                        `<span style="${driverTextStyle(getDriverColor(n))}">${escapeHtml(n)}</span>`
                        + (j === 0 && pair.length > 1 ? ',' : '')
                    ).join(' ') + trailing);
                }
                return lines.map(l => `<div style="white-space:nowrap;">${l}</div>`).join('');
            };

            const body = `<div style="margin-top:3px;font-size:12px;font-weight:600;line-height:1.35;">`;
            let html = `<div style="text-align:center;">
                            <div style="font-weight:700;font-size:14px;">${escapeHtml(title)}</div>`;

            if (spot.fieldDrivers.length) {
                html += body + nameBlock(spot.fieldDrivers) + `</div>`;
            }

            if (spot.parkingDrivers.length) {
                // Only label it when it needs distinguishing from the field list above.
                if (spot.fieldDrivers.length) {
                    html += `<div style="margin-top:5px;font-size:10px;opacity:.7;font-weight:400;">Parking Here:</div>`;
                }
                html += body + nameBlock(spot.parkingDrivers) + `</div>`;
            }

            return html + `</div>`;
        }

        function addStaffMarkers(force) {
            const filter = state.currentFilter;
            const renderKey = [
                filter || '',
                state.showStaff ? '1' : '0',
                state.staffData.length,
                state.locationsMap.size,
                state.staffData.map(d => getDriverColor(d.driver)).join(',')
            ].join('|');

            if (!force && renderKey === state.staffRenderKey && state.staffMarkers.length > 0) {
                return;
            }
            state.staffRenderKey = renderKey;

            clearStaffMarkers();

            if (!state.showStaff || !state.map) return;

            // No driver assignments today (Staff tab empty, missing, or everyone
            // OFF). Fall back to a plain, uncoloured picture: every known field as
            // a black diamond and every parking spot as a black P square. If even
            // the location list is missing, revert to the original Fields-tab
            // diamonds so the map is never left with no fields at all.
            if (!state.staffData || state.staffData.length === 0) {
                if (state.locationsMap.size === 0) {
                    state.useLegacyFields = true;
                    addFieldMarkers();
                    return;
                }
                state.useLegacyFields = false;
                state.locationsMap.forEach((loc, id) => {
                    try {
                        const kind = /P$/i.test(id) ? 'parking' : 'field';
                        const marker = L.marker([loc.lat, loc.lng], {
                            icon: createStaffIcon(kind, ['#000000']),
                            riseOnHover: true
                        });
                        marker._locationName = loc.name || loc.address || id;
                        marker._locationSize = kind === 'field' ? 30 : 26;
                        marker.bindTooltip(
                            `<div style="text-align:center;font-weight:700;font-size:14px;">${escapeHtml(marker._locationName)}</div>`,
                            { permanent: false, direction: 'top', offset: [0, -12],
                              className: 'field-marker-tooltip', opacity: 0.95 }
                        );
                        marker.addTo(state.map);
                        state.staffMarkers.push(marker);
                    } catch (error) {
                        console.warn('Fallback location marker failed:', error);
                    }
                });
                return;
            }
            // Assignments exist but nothing to plot them on: the J:N location
            // block is missing. Better the old Fields-tab diamonds than nothing.
            if (state.locationsMap.size === 0) {
                state.useLegacyFields = true;
                addFieldMarkers();
                return;
            }
            state.useLegacyFields = false;

            const visible = filter
                ? state.staffData.filter(s => s.driver === filter)
                : state.staffData;
            if (visible.length === 0) return;

            // Grouped by coordinate rather than by ID, because a few parking spots
            // sit exactly on a field (their Parking ID *is* a field ID). Those
            // collapse into the single field diamond instead of stacking a
            // redundant P square on top of it.
            const spots = new Map();
            const keyFor = loc => `${loc.lat.toFixed(5)},${loc.lng.toFixed(5)}`;

            visible.forEach(entry => {
                [['field', entry.fieldId], ['parking', entry.parkingId]].forEach(([kind, id]) => {
                    if (!id) return;
                    const loc = state.locationsMap.get(id);
                    if (!loc) {
                        console.warn(`No coordinates for location ID "${id}" (${entry.driver})`);
                        return;
                    }
                    const key = keyFor(loc);
                    if (!spots.has(key)) {
                        spots.set(key, {
                            id: id, lat: loc.lat, lng: loc.lng,
                            fieldDrivers: [], parkingDrivers: []
                        });
                    }
                    const spot = spots.get(key);
                    if (kind === 'field') {
                        spot.fieldDrivers.push(entry);
                        spot.id = id; // prefer the field's own id for the label
                    } else {
                        spot.parkingDrivers.push(entry);
                    }
                });
            });

            spots.forEach(spot => {
                try {
                    // A spot with anyone walking there is a field; parking-only
                    // spots keep the black P square.
                    const isField = spot.fieldDrivers.length > 0;
                    const banded = isField ? spot.fieldDrivers : spot.parkingDrivers;
                    const colors = banded
                        .slice()
                        .sort((a, b) => a.driver.localeCompare(b.driver))
                        .map(d => getDriverColor(d.driver));

                    const marker = L.marker([spot.lat, spot.lng], {
                        icon: createStaffIcon(isField ? 'field' : 'parking', colors),
                        riseOnHover: true
                    });

                    marker._locationName = locationLabel(spot.id, '') || spot.id;
                    marker._locationSize = isField ? 30 : 26;

                    marker.bindTooltip(buildStaffTooltip(spot), {
                        permanent: false,
                        direction: 'top',
                        offset: [0, -12],
                        className: 'field-marker-tooltip',
                        opacity: 0.95
                    });

                    marker.addTo(state.map);
                    state.staffMarkers.push(marker);
                } catch (error) {
                    console.warn('Error creating staff marker:', error);
                }
            });
        }
